# How the machine's release differs from the dev box, in plain Compose (FLEXCOMPOSE_DESIGN.md §13): FlexCompose
# merges it last, per service, for both release targets. release.sh sets RELEASE_VERSION from the git tag (v1.1.0
# gives 1.1.0, v1.1.0+acme gives 1.1.0_acme) and RELEASE_SRC to the repositories of lock.repos, checked out; the
# bundle's .env sets RELEASE_VERSION on the machine.
# Every service has the same three parts: its image's name, its build (the service's own Dockerfile, in its locked
# checkout, with the whole locked tree as the context named workspace) and the command the machine runs.
services:
  example_app:
    image: "cboost-c-nas:5100/example-app:${RELEASE_VERSION:?is set by release.sh from the git tag, and on the machine by the bundle's .env}"
    build:
      context: ${RELEASE_SRC:?is set by release.sh}/example_app
      additional_contexts:
        workspace: ${RELEASE_SRC:?is set by release.sh}
    command: ros2 launch example_app_bringup app.launch.py
  example_driver:
    image: "cboost-c-nas:5100/example-driver:${RELEASE_VERSION:?is set by release.sh from the git tag, and on the machine by the bundle's .env}"
    build:
      context: ${RELEASE_SRC:?is set by release.sh}/example_driver
      additional_contexts:
        workspace: ${RELEASE_SRC:?is set by release.sh}
    command: ros2 launch example_driver_bringup driver.launch.py
