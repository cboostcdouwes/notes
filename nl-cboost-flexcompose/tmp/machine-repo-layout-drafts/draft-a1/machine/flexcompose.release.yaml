services:
  app:
    image: "cboost-c-nas:5100/polymx-qc:${RELEASE_VERSION:?}"
    build:
      context: git@github.com:Cboostbv/nl-polymx-automated-qc-application.git#<sha>   # the app's pin: one line
      target: release
      ssh: [default]
      args: {BASE_IMAGE: cboost-c-nas:5100/cboost-ros2-jazzy:0.2.0}
    command: ros2 launch polymx_qc_app polymx_stack.launch.py
