# Machine repo (A1 draft): the template, the release, one pin per service. No recipes, no package pins.
flexcompose_options:
  targets: [devbox:host-src, release:build, release]
services:
  app:
    flexcompose_options: {workspace: true, enable_gpu: true}
    image: cboost-c-nas:5100/cboost-ros2-jazzy:0.2.0      # the dev box's image (rsd: the app repo's build base must follow it)
    network_mode: host
    command: dev
  inference:
    image: cboost-c-nas:5100/polymx-serve:<sha>
    pull_policy: build
    build:
      context: git@github.com:Cboostbv/nl-polymx-ai-suite-inference.git#<sha>
      dockerfile: Dockerfile.serve
    ports: ["127.0.0.1:8080:8080"]
