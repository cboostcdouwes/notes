flexcompose_options:
  targets: [devbox:host-src, devbox:host, devbox:volume, release:build, release]
services:
  app:
    flexcompose_options: {workspace: true, enable_gpu: true, enable_gui: true}
    image: cboost-c-nas:5100/cboost-ros2-jazzy:0.2.0
    network_mode: host
    command: dev
  inference:
    flexcompose_options: {enable_gpu: true}
    image: cboost-c-nas:5100/polymx-serve:<sha>
    pull_policy: build
    build:
      context: git@github.com:Cboostbv/nl-polymx-ai-suite-inference.git#<sha>
      dockerfile: Dockerfile.serve
    volumes: ["./programs/inference/src:/app/src"]     # its checkout over the image's package, always
    command: sh -c "pip install -e /app && exec uvicorn serve:app --host 127.0.0.1 --port 8080"
    ports: ["127.0.0.1:8080:8080"]
